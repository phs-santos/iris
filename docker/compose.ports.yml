# macOS e Windows: o Docker Desktop não expõe a rede do host por padrão, então o
# network_mode: host do docker-compose.yml deixa o WSS inacessível. Este arquivo troca por portas mapeadas.
# Uso: docker compose -f docker-compose.yml -f docker/compose.ports.yml up -d
services:
    asterisk:
        network_mode: !reset null
        # Sem isso o Asterisk põe o id do container (ex.: 3e302e78b64b) no From, e o SIP.js
        # descarta o INVITE: o último rótulo de um nome de host não pode começar com dígito.
        hostname: asterisk
        networks:
            pbx:
                ipv4_address: 172.28.0.10
        ports:
            - '8088:8088'
            - '8089:8089'
            - '10000-10100:10000-10100/udp'
        volumes:
            - ./docker/asterisk/rtp-ports.conf:/etc/asterisk/rtp.conf:ro

networks:
    pbx:
        ipam:
            config:
                - subnet: 172.28.0.0/24
