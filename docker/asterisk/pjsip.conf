; PBX de teste da Íris: WebSocket seguro em wss://localhost:8089/ws (certificado autoassinado).
; Ramais 1001 a 1020, senha 1234 (20 ramais para o teste de carga, RNF-03). Só para uso local.
; Ramais 2001 a 2005, senha 1234: SIP puro por UDP, TCP ou TLS (RF-39).

[transport-wss]
type=transport
protocol=wss
bind=0.0.0.0

; SIP puro, sem WebRTC, para o motor próprio da Íris (RF-39): UDP e TCP na 5060, TLS na 5061.
[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

[transport-tcp]
type=transport
protocol=tcp
bind=0.0.0.0:5060

[transport-tls]
type=transport
protocol=tls
bind=0.0.0.0:5061
cert_file=/etc/asterisk/keys/asterisk.crt
priv_key_file=/etc/asterisk/keys/asterisk.key
method=tlsv1_2

[endpoint-webrtc](!)
type=endpoint
context=bench
disallow=all
allow=opus,ulaw,alaw
webrtc=yes
dtls_auto_generate_cert=yes

[auth-1234](!)
type=auth
auth_type=userpass
password=1234

[aor-ramal](!)
type=aor
max_contacts=5
remove_existing=yes
qualify_frequency=0

[1001](endpoint-webrtc)
auth=1001
aors=1001
callerid="Ramal 1001" <1001>

[1001](auth-1234)
username=1001

[1001](aor-ramal)

