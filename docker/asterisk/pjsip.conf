; PBX de teste do SIP Bench: WebSocket seguro em wss://localhost:8089/ws (certificado autoassinado).
; Ramais 1001 a 1003, senha 1234. Só para uso local.

[transport-wss]
type=transport
protocol=wss
bind=0.0.0.0

[1001]
type=endpoint
context=bench
disallow=all
allow=opus,ulaw,alaw
webrtc=yes
dtls_auto_generate_cert=yes
auth=1001
aors=1001
callerid="Ramal 1001" <1001>

[1001]
type=auth
auth_type=userpass
username=1001
password=1234

[1001]
type=aor
max_contacts=5
remove_existing=yes
qualify_frequency=0

[1002]
type=endpoint
context=bench
disallow=all
allow=opus,ulaw,alaw
webrtc=yes
dtls_auto_generate_cert=yes
auth=1002
aors=1002
callerid="Ramal 1002" <1002>

[1002]
type=auth
auth_type=userpass
username=1002
password=1234

[1002]
type=aor
max_contacts=5
remove_existing=yes
qualify_frequency=0

