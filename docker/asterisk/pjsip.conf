; ─── SIP puro (RF-39) ───────────────────────────────────────────────────────
[endpoint-sip](!)
type=endpoint
context=bench
disallow=all
allow=ulaw,alaw
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
; O áudio sai anunciado em 127.0.0.1: é onde as portas RTP ficam, tanto com a rede do host (Linux)
; quanto com as portas mapeadas do Docker Desktop. O PBX de teste só serve para a própria máquina.
media_address=127.0.0.1

[2001](endpoint-sip)
auth=2001
aors=2001
callerid="Ramal 2001" <2001>

[2001](auth-1234)
username=2001

[2001](aor-ramal)

