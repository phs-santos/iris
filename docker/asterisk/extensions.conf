; Plano de discagem de teste da Íris.
[bench]
; Ramais entre si
exten => _10XX,1,Dial(PJSIP/${EXTEN},30)
 same => n,Hangup()
; Ramais de SIP puro (RF-39)
exten => _200X,1,Dial(PJSIP/${EXTEN},30)
 same => n,Hangup()

; URA: atende, espera até 4 dígitos e registra no log do Asterisk
exten => 8000,1,Answer()
 same => n,Wait(1)
 same => n,Read(DIGITOS,,4,,1,15)
 same => n,Log(NOTICE,URA recebeu ${DIGITOS})
 same => n,Hangup()

; Eco: devolve o próprio áudio
exten => 600,1,Answer()
 same => n,Echo()

; Mudo: atende e não manda áudio nenhum, para testar a verificação de áudio dos cenários (RF-41)
exten => 601,1,Answer()
 same => n,Wait(60)
 same => n,Hangup()

; Ocupado
exten => 486,1,Busy(5)
