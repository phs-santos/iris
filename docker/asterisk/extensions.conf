; Plano de discagem de teste do Argos.
[bench]
; Ramais entre si
exten => _100X,1,Dial(PJSIP/${EXTEN},30)
 same => n,Hangup()

; URA: atende, espera até 4 dígitos e registra no log do Asterisk
exten => 8000,1,Answer()
 same => n,Wait(1)
 same => n,Read(DIGITOS,,4,,1,15)
 same => n,Log(NOTICE,URA recebeu ${DIGITOS})
 same => n,Hangup()

; Eco: devolve o próprio áudio
exten => 600,1,Answer()
 same => n,Echo()

; Ocupado
exten => 486,1,Busy(5)
