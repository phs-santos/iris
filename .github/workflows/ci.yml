name: CI

# No PR roda só a verificação rápida. Os testes de ponta a ponta rodam na main e quando alguém pede
# (Actions → CI → Run workflow); não bloqueiam a publicação, que tem a sua própria fumaça.
on:
    push:
        branches: [main]
    pull_request:
    workflow_dispatch:

jobs:
    check:
        # Um passo travado reprova em minutos, em vez de segurar o CI até o limite de 6 horas.
        timeout-minutes: 20
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, windows-latest, macos-latest]
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci
            - run: npm run format:check
            - run: npm run lint
            - run: npm run licenses
            - run: npm run typecheck
            # Testes de unidade com cobertura da camada de domínio: reprova abaixo de 70% (RNF-15).
            - run: npm run test:coverage
            - run: npm run build
            - uses: actions/upload-artifact@v4
              if: matrix.os == 'ubuntu-latest'
              with:
                  name: cobertura
                  path: coverage/

    e2e:
        if: github.event_name != 'pull_request'
        timeout-minutes: 60
        runs-on: ubuntu-latest
        needs: check
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci
            - run: npm run build
            # O Ubuntu 24.04 bloqueia o sandbox do Chromium para binários fora de pacotes do sistema.
            # Liberar aqui mantém o sandbox ligado nos testes, como no app instalado.
            # Cada teste roda mesmo que um anterior tenha falhado (`!cancelled()`): uma falha no começo não
            # esconde o resultado da chamada com o Asterisk, e o job continua reprovando.
            - name: Liberar o sandbox do Chromium
              run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
            - name: Ponta a ponta no modo simulado
              if: ${{ !cancelled() }}
              run: xvfb-run -a node tests/e2e/smoke.mjs
            - name: Acessibilidade (axe, WCAG A/AA) e atalhos da janela
              if: ${{ !cancelled() }}
              run: xvfb-run -a node tests/e2e/a11y.mjs
            - name: Senhas em arquivo local e migração do formato antigo (RNF-07)
              if: ${{ !cancelled() }}
              run: xvfb-run -a node tests/e2e/senhas.mjs
            - name: Arquivos de dados estragados, gravação em fila e log interno (RNF-14, RNF-19)
              if: ${{ !cancelled() }}
              run: xvfb-run -a node tests/e2e/arquivos.mjs
            - name: Notificações
              if: ${{ !cancelled() }}
              run: xvfb-run -a node tests/e2e/notificacoes.mjs
            - name: Contatos e servidores cadastrados (RF-50, RF-51)
              if: ${{ !cancelled() }}
              run: xvfb-run -a node tests/e2e/contatos.mjs
            - name: Toque por conta e volume do toque (RF-55)
              if: ${{ !cancelled() }}
              run: xvfb-run -a node tests/e2e/toques.mjs
            - name: Subir Asterisk de teste
              if: ${{ !cancelled() }}
              run: |
                  ./docker/asterisk/gen-cert.sh
                  docker compose up -d
                  sleep 8
            # A única ligação de verdade: registro UDP, ligar, DTMF, espera, transferência e desligar.
            - name: Chamada pela tela, simulada e no Asterisk
              if: ${{ !cancelled() }}
              run: PBX_WS=wss://127.0.0.1:8089/ws xvfb-run -a node tests/e2e/chamada.mjs
