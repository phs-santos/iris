name: CI

on:
    push:
        branches: [main]
    pull_request:

jobs:
    check:
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, windows-latest, macos-latest]
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci
            - run: npm run format:check
            - run: npm run licenses
            - run: npm run typecheck
            - run: npm test
            - run: npm run build

    e2e:
        runs-on: ubuntu-latest
        needs: check
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci
            - run: npm run build
            - name: Ponta a ponta no modo simulado
              run: xvfb-run -a node tests/e2e/smoke.mjs
            - name: Cenários no modo simulado
              run: RUNS=5 xvfb-run -a node tests/e2e/scenarios.mjs
            - name: Cenários pela linha de comando
              run: xvfb-run -a node tests/e2e/cli.mjs
            - name: Acessibilidade (axe, WCAG A/AA) e atalhos
              run: xvfb-run -a node tests/e2e/a11y.mjs
            - name: Subir Asterisk de teste
              run: |
                  ./docker/asterisk/gen-cert.sh
                  docker compose up -d
                  sleep 8
            - name: Integração com Asterisk
              run: xvfb-run -a node tests/e2e/asterisk.mjs
            - name: Cenário de URA 20 vezes no Asterisk (critério do M3)
              run: PBX_WS=wss://127.0.0.1:8089/ws xvfb-run -a node tests/e2e/scenarios.mjs
            - name: URA 20 vezes pela linha de comando no Asterisk
              run: PBX_WS=wss://127.0.0.1:8089/ws xvfb-run -a node tests/e2e/cli.mjs
