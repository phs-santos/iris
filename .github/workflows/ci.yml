name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Ponta a ponta no modo simulado
        run: xvfb-run -a node tests/e2e/smoke.mjs
      - name: Subir Asterisk de teste
        run: |
          ./docker/asterisk/gen-cert.sh
          docker compose up -d
          sleep 8
      - name: Integração com Asterisk
        run: xvfb-run -a node tests/e2e/asterisk.mjs
