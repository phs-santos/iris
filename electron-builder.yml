appId: dev.iris.softphone
productName: Iris
directories:
    buildResources: build
    output: dist
files:
    - out/**
    - resources/**
    - package.json
# Fuses do Electron (revisão de segurança, M4): o binário não roda como Node, não aceita
# NODE_OPTIONS nem --inspect, só carrega o app de dentro do asar e confere a integridade dele.
# grantFileProtocolExtraPrivileges fica ligado: a interface carrega módulos por file://.
electronFuses:
    runAsNode: false
    enableCookieEncryption: true
    enableNodeOptionsEnvironmentVariable: false
    enableNodeCliInspectArguments: false
    enableEmbeddedAsarIntegrityValidation: true
    onlyLoadAppFromAsar: true
    # Sem certificado, refaz a assinatura ad-hoc depois de mexer no binário (o macOS em Apple Silicon
    # mata binários com assinatura inválida). Com o Developer ID do M4, a assinatura real substitui esta.
    resetAdHocDarwinSignature: true
# Atualização automática (RF-35): o app instalado procura versões novas nos releases deste repositório.
# Os scripts dist:* usam --publish never: geram os arquivos (latest*.yml), mas não enviam nada.
publish:
    provider: github
    owner: phs-santos
    repo: iris
win:
    target: nsis
nsis:
    # Sem espaço no nome: o GitHub troca espaço por ponto e o latest.yml deixaria de bater com o arquivo.
    artifactName: ${productName}-Setup-${version}.${ext}
    oneClick: false
    allowToChangeInstallationDirectory: true
mac:
    # A arquitetura sempre no nome: sem isso o de Intel sai como "Iris-1.0.2.dmg" e parece ser o único.
    artifactName: ${productName}-${version}-${arch}.${ext}
    # O .zip é o que a atualização automática do macOS baixa (RF-35); o .dmg é para instalar à mão.
    target:
        - target: dmg
          arch: [arm64, x64]
        - target: zip
          arch: [arm64, x64]
    category: public.app-category.developer-tools
    extendInfo:
        NSMicrophoneUsageDescription: A Íris usa o microfone nas chamadas de teste.
linux:
    target:
        - AppImage
        - deb
    category: Development
    # O .deb exige um mantenedor com e-mail; este é o endereço público da conta no GitHub.
    maintainer: Paulo Souza <phs-santos@users.noreply.github.com>
